runtime: python-3.10

services:
  - type: web
    name: filehost-backend
    runtime: node
    runtimeVersion: 18
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: filehost-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: filehost-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        value: filehost

  - type: web
    name: filehost-frontend
    runtime: node
    runtimeVersion: 18
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: filehost-backend
          property: url

databases:
  - name: filehost-db
    engine: postgres
    version: 15

redis:
  - name: filehost-redis
    plan: free
